<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LatinaTapes | Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="login-page">
    <header class="header">
        <nav class="nav">
            <div class="logo">
                <a href="index.html" style="color: white; text-decoration:none;">LatinaTapes</a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="https://enviousgarbage.com/jkm4UM">Categories</a></li>
                <li><a href="https://enviousgarbage.com/jkm4UM">Celebrity Leaks</a></li>
                <li><a href="https://enviousgarbage.com/jkm4UM">Leaked Videos</a></li>
                <li><a style="color: red;" href="login.html">Login</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <div class="login-container">
        <div class="login-box">
            <h2><i class="fa-solid fa-lock" style="color: var(--accent-primary); margin-right: 8px;"></i>Admin Login</h2>
            <p class="login-subtitle">Enter your credentials to access the upload panel</p>

            <div class="login-error" id="loginError"></div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="off">
                        <button type="button" class="toggle-password" id="togglePassword" title="Show/Hide Password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-right-to-bracket" style="margin-right: 8px;"></i>Sign In
                </button>
            </form>

            <p style="text-align: center; margin-top: 25px; color: var(--text-secondary); font-size: 0.85rem;">
                <a href="index.html" style="color: var(--accent-primary);"><i class="fa-solid fa-arrow-left" style="margin-right: 5px;"></i>Back to Home</a>
            </p>
        </div>
    </div>

    <footer class="site-footer" style="margin-top: 0;">
        <div class="footer-content">
            <div class="footer-logo">LatinaTapes</div>
            <p class="footer-copyright">
                &copy;2025 LatinaTapes. All Rights Reserved.
            </p>
        </div>
    </footer>

    <script src="assets/js/scriptx.js"></script>
</body>
</html>
